<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0867f2">
  <title>Connect</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0867f2;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 12px;
    }
    .phone-page {
      width: min(100%, 430px);
      min-height: 760px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      background: #fff;
      border-radius: 34px;
      padding: 42px 24px 38px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.15);
    }
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      margin: 0 auto 24px;
      border: 5px solid #18c96b;
      background: linear-gradient(135deg, #d9d9d9, #777);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 42px;
      font-weight: 700;
    }
    .online {
      color: #16bd62;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 42px;
    }
    .online::before {
      content: "";
      display: inline-block;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #18c96b;
      margin-right: 10px;
      vertical-align: 2px;
    }
    .connecting {
      color: #12bd69;
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 30px;
    }
    .instruction {
      color: #31465a;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 25px;
    }
    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 74px;
      border-radius: 40px;
      background: #16d35d;
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
      box-shadow: 0 6px 14px rgba(0,0,0,.12);
      transition: transform .12s ease, filter .12s ease;
    }
    .cta:hover { filter: brightness(.96); }
    .cta:active { transform: scale(.98); }
    .wa {
      width: 38px;
      height: 38px;
      border: 3px solid #fff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .disclosure {
      margin-top: 18px;
      color: #657383;
      font-size: 12px;
      line-height: 1.4;
    }
    @media (max-width: 480px) {
      .phone-page { min-height: 100vh; }
      .card { padding: 34px 18px 30px; border-radius: 28px; }
      .online { font-size: 21px; margin-bottom: 32px; }
      .connecting { font-size: 22px; }
      .instruction { font-size: 17px; }
      .cta { font-size: 20px; min-height: 68px; }
    }
  </style>
</head>
<body>
  <main class="phone-page">
    <section class="card">
      <div class="avatar" aria-hidden="true">♥</div>
      <div class="online">Online now</div>
      <div class="connecting">💬 Connecting to WhatsApp...</div>
      <div class="instruction">👇 CLICK BELOW TO CONTINUE 👇</div>

      <!-- Your Adsterra Direct Link -->
      <a class="cta"
         href="https://guyprior.com/zeg6rv42j?key=4e0480dea83bb5a476a1dba62b27a53b"
         target="_blank"
         rel="noopener noreferrer">
        <span class="wa">↗</span>
        CONTINUE
      </a>

      <div class="disclosure">
        You will be redirected to an external offer.
      </div>
    </section>
  </main>
</body>
</html>
